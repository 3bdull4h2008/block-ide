id = "w5-02-max-of-three"
world = 5
title = "Max of Three"
xp = 20
starter = """#include <stdio.h>

static int max3(int a, int b, int c) {
    return a;
}

int main(void) {
    int a, b, c;
    if (scanf("%d %d %d", &a, &b, &c) != 3) return 1;
    printf("%d\n", max3(a, b, c));
    return 0;
}
"""

[[tests]]
stdin = "1 2 3\n"
stdout = "3\n"
exit = 0

[[tests]]
stdin = "9 4 4\n"
stdout = "9\n"
exit = 0

[[tests]]
stdin = "-1 -5 -3\n"
stdout = "-1\n"
exit = 0

[[hints]]
text = 'Start m = a, then improve it twice.'

[[hints]]
text = 'if (b > m) m = b; then the same for c.'

[[hints]]
text = 'Return m at the end.'

[solution]
path = "solution.c"
