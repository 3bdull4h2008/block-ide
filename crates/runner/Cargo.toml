[package]
name = "runner"
version = "0.1.0"
edition = "2021"
description = "Compile + sandboxed execution of user C programs (PLAN.md step 2.2). One owner for the run seam."

[dependencies]
core-parser = { path = "../core-parser" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Diagnostics_Debug"] }
