name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # frontend FIRST: tauri codegen embeds ../dist at compile time — without
      # this, `cargo test` cannot even build the app crate on a clean runner
      - name: npm ci
        working-directory: app
        run: npm ci

      - name: frontend build
        working-directory: app
        run: npm run build

      # parser binaries needed by integration tests and vitest
      - name: build parser binaries
        run: cargo build -p core-parser --bins

      # tcc resources dir required by tauri codegen during cargo test
      - name: copy tcc resources
        working-directory: app
        run: npm run copytcc

      # rust side: unit + integration tests (round-trip, recovery)
      # (perf wall-clock asserts excluded — shared runners flake on Defender scans)
      - name: cargo test
        run: cargo test --workspace -- --skip opens_5k_file_project_under_3s
        env:
          BLOCKIDE_DATA_DIR: ${{ runner.temp }}/blockide-ci-data

      # headless editor-model suites shell out to debug bins built by cargo test
      # (parser bins already built above)

      - name: typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: vitest
        working-directory: app
        run: npx vitest run